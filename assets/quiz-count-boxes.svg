<svg xmlns="http://www.w3.org/2000/svg" width="700" height="427" viewBox="0 0 700 427"><rect width="700" height="427" fill="#f0e4c9"/><rect x="14" y="14" width="672" height="399" fill="none" stroke="#ab8b59"/><path d="M34 34H666V393H34Z" fill="none" stroke="#bda57f"/><text x="44" y="60" font-family="Georgia,serif" font-size="18" fill="#856642" letter-spacing="2">THE THREE SEALED BOXES</text><path d="M44 83H656" stroke="#b69b70"/><text x="44" y="141" font-size="27" fill="#493025">달 상자: “초대장은 이 안에 있다.”</text><text x="44" y="204" font-size="27" fill="#493025">별 상자: “초대장은 달 상자에 없다.”</text><text x="44" y="267" font-size="27" fill="#493025">왕관 상자: “초대장은 이 안에 없다.”</text><text x="44" y="330" font-size="27" fill="#493025">세 문장 중, 단 하나만 참.</text><text x="44" y="390" font-family="Georgia,serif" font-size="14" fill="#92734e" letter-spacing="2">A NOTE FROM YOUR HOST</text></svg>