<svg xmlns="http://www.w3.org/2000/svg" width="700" height="364" viewBox="0 0 700 364"><rect width="700" height="364" fill="#f0e4c9"/><rect x="14" y="14" width="672" height="336" fill="none" stroke="#ab8b59"/><path d="M34 34H666V330H34Z" fill="none" stroke="#bda57f"/><text x="44" y="60" font-family="Georgia,serif" font-size="18" fill="#856642" letter-spacing="2">THE CONFECTIONER’S RULES</text><path d="M44 83H656" stroke="#b69b70"/><text x="44" y="141" font-size="27" fill="#493025">초대권이 있으면 황금 인장도 있다.</text><text x="44" y="204" font-size="27" fill="#493025">황금 인장이 있으면 리본도 있다.</text><text x="44" y="267" font-size="27" fill="#493025">초대권이 있으면 민트 향도 난다.</text><text x="44" y="327" font-family="Georgia,serif" font-size="14" fill="#92734e" letter-spacing="2">A NOTE FROM YOUR HOST</text></svg>