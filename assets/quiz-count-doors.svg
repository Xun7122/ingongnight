<svg xmlns="http://www.w3.org/2000/svg" width="700" height="490" viewBox="0 0 700 490"><rect width="700" height="490" fill="#f0e4c9"/><rect x="14" y="14" width="672" height="462" fill="none" stroke="#ab8b59"/><path d="M34 34H666V456H34Z" fill="none" stroke="#bda57f"/><text x="44" y="60" font-family="Georgia,serif" font-size="18" fill="#856642" letter-spacing="2">A QUESTION AT THE DOOR</text><path d="M44 83H656" stroke="#b69b70"/><text x="44" y="141" font-size="27" fill="#493025">두 문 중 하나에만 초대장이 있다.</text><text x="44" y="204" font-size="27" fill="#493025">당신이 문지기에게 물었다.</text><text x="44" y="267" font-size="27" fill="#493025">“다른 문지기에게 초대장의 위치를</text><text x="44" y="330" font-size="27" fill="#493025">물으면 어느 문이라고 할까요?”</text><text x="44" y="393" font-size="27" fill="#493025">대답: “왼쪽.”</text><text x="44" y="453" font-family="Georgia,serif" font-size="14" fill="#92734e" letter-spacing="2">A NOTE FROM YOUR HOST</text></svg>